name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-db:
    name: Push SQL Migrations to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply Declarative SQL Migrations via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF secret is missing."
            exit 1
          fi

          API_URL="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"

          run_sql() {
            local sql_content="$1"
            local payload
            payload=$(jq -n --arg q "$sql_content" '{query: $q}')
            local response
            response=$(curl -sS -w "\n%{http_code}" -X POST "$API_URL" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload")
            local http_code
            http_code=$(echo "$response" | tail -n1)
            local body
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "SQL execution failed (HTTP $http_code): $body"
              exit 1
            fi
            echo "$body"
          }

          echo "==> Ensuring schema_migrations tracking table exists..."
          run_sql "create table if not exists public.schema_migrations (version text primary key, applied_at timestamptz not null default now());" >/dev/null

          for file in $(ls supabase/migrations/*.sql | sort); do
            version=$(basename "$file")
            already_applied=$(run_sql "select version from public.schema_migrations where version = '$version';" | jq -r '.[0].version // empty')
            if [ "$already_applied" = "$version" ]; then
              echo "==> Skipping $version (already applied)"
            else
              echo "==> Applying migration: $version"
              sql_body=$(cat "$file")
              run_sql "$sql_body" >/dev/null
              run_sql "insert into public.schema_migrations (version) values ('$version') on conflict do nothing;" >/dev/null
              echo "==> Successfully applied $version"
            fi
          done
