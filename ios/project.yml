name: Reshima
options:
  bundleIdPrefix: com.zipori
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.15.0

targets:
  Reshima:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Reshima
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zipori.reshima
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Attach photos of specific grocery items or brands to your shopping list."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose photos of grocery items to attach to your shopping list."
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    info:
      path: Reshima/Info.plist
      properties:
        CFBundleDisplayName: "Reshima רשימה"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSCameraUsageDescription: "Attach photos of specific grocery items or brands to your shopping list."
        NSPhotoLibraryUsageDescription: "Choose photos of grocery items to attach to your shopping list."
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
    dependencies:
      - package: Supabase
        product: Supabase

  ReshimaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReshimaTests
    dependencies:
      - target: Reshima
