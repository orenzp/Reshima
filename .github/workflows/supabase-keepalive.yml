name: Supabase Free-Tier Keep-Alive

on:
  schedule:
    # Runs every Monday and Thursday at 08:00 UTC so Supabase Free Tier never pauses after 7 days
    - cron: "0 8 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write # only to re-enable this workflow (see last step)

jobs:
  ping-supabase:
    name: Ping Supabase REST Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive query to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not configured yet; skipping ping."
            exit 0
          fi
          # Anonymous callers see no rows (RLS), but the query still reaches the database.
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase keep-alive HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Keep-alive failed: the project may be paused or the anon key is wrong."
            exit 1
          fi

      - name: Keep this schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        # Re-enabling on every run resets that timer.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
