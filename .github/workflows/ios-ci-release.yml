name: iOS Build, Test & SideStore OTA Release

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "Package.swift"
      - "scripts/**"
      - ".github/workflows/ios-ci-release.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only by default; only the release job below may write.
permissions:
  contents: read

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build & Test Reshima iOS App
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Core Domain Unit Tests
        run: swift test

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project via XcodeGen
        run: |
          cd ios
          xcodegen generate

      - name: Build Unsigned iOS Release App
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x scripts/*.sh
          xcodebuild build \
            -project ios/Reshima.xcodeproj \
            -scheme Reshima \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            SUPABASE_URL="${SUPABASE_URL}" \
            SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA for SideStore / AltStore
        run: |
          ./scripts/package-ipa.sh \
            build/DerivedData/Build/Products/Release-iphoneos/Reshima.app \
            build/Reshima.ipa

      - name: Generate SideStore / AltStore OTA Source JSON
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          IPA_SIZE=$(stat -f%z build/Reshima.ipa)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="${APP_VERSION}" # must equal the IPA's CFBundleShortVersionString or SideStore rejects the update
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Reshima.ipa"

          cat > build/altstore-source.json <<EOF
          {
            "name": "Reshima (רשימה) Family Source",
            "identifier": "com.zipori.reshima.source",
            "apps": [
              {
                "name": "Reshima רשימה",
                "bundleIdentifier": "com.zipori.reshima",
                "developerName": "Oren Zipori",
                "localizedDescription": "Shared household shopping list synced in real-time via Supabase.",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/ios/Reshima/Resources/AppIcon.png",
                "versions": [
                  {
                    "version": "${VERSION}",
                    "date": "${BUILD_DATE}",
                    "localizedDescription": "Automated build #${{ github.run_number }} from commit ${{ github.sha }}",
                    "downloadURL": "${DOWNLOAD_URL}",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "17.0"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Upload IPA & SideStore Source Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Reshima-iOS-Build-${{ github.run_number }}
          path: |
            build/Reshima.ipa
            build/altstore-source.json

  release:
    name: Publish IPA to GitHub Releases
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Reshima-iOS-Build-${{ github.run_number }}
          path: build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Reshima v${{ env.APP_VERSION }}"
          files: |
            build/Reshima.ipa
            build/altstore-source.json
          generate_release_notes: true
